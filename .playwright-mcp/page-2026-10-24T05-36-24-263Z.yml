          - strong [ref=f49e250]: "Website:"
          - link "www.grandpasundanhotel.com" [ref=f49e251] [cursor=pointer]:
            - /url: https://grandpasundanhotel.com/?utm_source=chatgpt.com
        - paragraph [ref=f49e252]:
          - strong [ref=f49e253]: Terms & Conditions apply.
        - paragraph [ref=f49e254]
        - paragraph [ref=f49e255]
        - separator [ref=f49e256]
        - heading [level=2] [ref=f49e257]:
          - strong [ref=f49e258]: GRAND PASUNDAN CONVENTION HOTEL DUKUNG HARI JADI KOTA BANDUNG KE-216 TINGKAT KECAMATAN BOJONGLOA KALER
        - paragraph [ref=f49e259]
        - paragraph [ref=f49e260]:
          - strong [ref=f49e261]: Memperkuat Komitmen Melestarikan Budaya Pasundan melalui Dukungan terhadap Kegiatan Masyarakat
        - paragraph [ref=f49e262]:
          - strong [ref=f49e263]: Bandung, September 2026
          - text: — Dalam rangka memperingati
          - strong [ref=f49e264]: Hari Jadi Kota Bandung (HJKB) ke-216 Tahun 2026
          - text: ", Grand Pasundan Convention Hotel turut berpartisipasi mendukung rangkaian kegiatan tingkat"
          - strong [ref=f49e265]: Kecamatan Bojongloa Kaler
          - text: melalui dukungan sponsorship.
        - paragraph [ref=f49e266]: Partisipasi ini merupakan bentuk komitmen Grand Pasundan Convention Hotel dalam mendukung kegiatan positif yang melibatkan masyarakat sekaligus menjadi bagian dari upaya menjaga dan memperkenalkan kekayaan budaya lokal Kota Bandung dan Jawa Barat.
        - paragraph [ref=f49e267]:
          - text: Pemilihan Kecamatan Bojongloa Kaler sebagai salah satu kegiatan yang didukung oleh Grand Pasundan Convention Hotel tidak terlepas dari konsep rangkaian acara yang menghadirkan
          - strong [ref=f49e268]: beragam perlombaan dan aktivitas yang sarat dengan unsur budaya dan kearifan lokal
          - text: .
        - paragraph [ref=f49e269]:
          - text: Hal tersebut dinilai sangat sejalan dengan identitas dan nilai yang diusung Grand Pasundan Convention Hotel melalui slogan
          - strong [ref=f49e270]: “Preserve Pasundan Tradition.”
        - paragraph [ref=f49e271]:
          - strong [ref=f49e272]: “Kami melihat kegiatan Hari Jadi Kota Bandung ke-216 tingkat Kecamatan Bojongloa Kaler memiliki nilai yang sangat positif, khususnya karena banyak kegiatan dan perlombaan yang mengangkat budaya serta kearifan lokal. Hal ini sangat relevan dengan semangat Grand Pasundan untuk terus menjaga dan melestarikan tradisi Pasundan melalui slogan kami, ‘Preserve Pasundan Tradition’,”
          - text: ujar Irina Yusha Fadilah sebagai Sales Marketing Manager Grand Pasundan Convention Hotel.
        - paragraph [ref=f49e273]: Menurut Grand Pasundan Convention Hotel, pelestarian budaya tidak hanya dilakukan melalui kegiatan formal, tetapi juga dapat diwujudkan melalui dukungan terhadap aktivitas masyarakat yang memberikan ruang bagi generasi muda untuk mengenal, menikmati, dan ikut melestarikan budaya daerah.
        - paragraph [ref=f49e274]: Rangkaian kegiatan HJKB ke-216 di tingkat Kecamatan Bojongloa Kaler diharapkan dapat menjadi momentum untuk mempererat kebersamaan masyarakat sekaligus menumbuhkan rasa bangga terhadap identitas dan budaya Kota Bandung.
        - paragraph [ref=f49e275]: Melalui sponsorship ini, Grand Pasundan Convention Hotel berharap dapat terus membangun hubungan yang baik dengan masyarakat dan berbagai pemangku kepentingan di wilayah Bandung, sekaligus mengambil bagian dalam kegiatan yang memberikan dampak positif bagi lingkungan sekitar.
        - paragraph [ref=f49e276]:
          - text: Sebagai hotel yang membawa nama
          - strong [ref=f49e277]: Pasundan
          - text: ", Grand Pasundan Convention Hotel berkomitmen untuk tidak hanya menjadi bagian dari perkembangan industri hospitality di Bandung, tetapi juga turut menjaga nilai-nilai budaya dan kearifan lokal yang menjadi bagian dari identitas Jawa Barat."
        - paragraph [ref=f49e278]:
          - strong [ref=f49e279]: “Preserve Pasundan Tradition”
          - text: bukan sekadar slogan, tetapi menjadi semangat Grand Pasundan Convention Hotel untuk terus hadir, mendukung, dan berkontribusi dalam berbagai kegiatan yang memiliki nilai budaya serta memberikan manfaat bagi masyarakat.
          - strong [ref=f49e280]: ”
        - paragraph [ref=f49e281]
        - separator [ref=f49e282]
        - heading [level=2] [ref=f49e283]:
          - strong [ref=f49e284]: September Bersama” Hadir di Grand Pasundan Convention Hotel, Nikmati Staycation Lengkap dengan Beragam Benefit Menarik
        - paragraph [ref=f49e285]:
          - strong [ref=f49e286]
        - paragraph [ref=f49e287]:
          - text: Bandung, September 2026 — Menyambut bulan September, Grand Pasundan Convention Hotel Bandung menghadirkan program spesial bertajuk
          - strong [ref=f49e288]: “SeptemBersama”,
          - text: sebuah promo yang dirancang untuk memberikan pengalaman menginap yang lebih lengkap dan menyenangkan bagi para tamu, khususnya keluarga maupun wisatawan yang ingin menikmati momen liburan di Kota Bandung.
        - paragraph [ref=f49e289]: Melalui program ini, tamu dapat menikmati harga spesial mulai dari Rp688.818 nett/room/night, dengan berbagai keuntungan yang telah dipersiapkan untuk melengkapi pengalaman menginap.
        - paragraph [ref=f49e290]:
          - text: Dengan harga tersebut, tamu akan mendapatkan kamar Deluxe termasuk sarapan untuk 2 orang, akses gratis ke swimming pool dan fitness center, serta Free Fettuccine Al Forno untuk 2 orang. Tidak hanya itu, program “Septem
          - strong [ref=f49e291]: Bersama
          - text: ” juga memberikan berbagai benefit tambahan yang semakin menarik.
        - paragraph [ref=f49e292]: Bagi tamu yang sedang merayakan ulang tahun selama periode menginap, Grand Pasundan Convention Hotel memberikan kesempatan untuk merayakan birthday dengan special 10% discount. Tamu juga dapat menikmati diskon 10% untuk seluruh menu Food & Beverage di outlet hotel, serta kesempatan mendapatkan free room upgrade dengan ketentuan berdasarkan ketersediaan kamar.
        - paragraph [ref=f49e293]: Yang membuat program ini semakin istimewa, tamu juga berkesempatan mendapatkan Free Ticket The Lodge Maribaya, destinasi wisata alam populer di kawasan Bandung yang menawarkan pengalaman menikmati suasana sejuk dan keindahan alam.
        - paragraph [ref=f49e294]:
          - strong [ref=f49e295]: “Melalui program September Bersama, kami ingin memberikan lebih dari sekadar pengalaman menginap. Kami ingin tamu dapat menikmati berbagai fasilitas, kuliner, rekreasi, sekaligus menghabiskan quality time bersama keluarga maupun orang-orang terdekat selama berada di Bandung,”
          - text: ujar Irina Yusha Fadilah, Sales & Marketing Manager Grand Pasundan Convention Hotel.
        - paragraph [ref=f49e296]: Program “September Bersama” berlaku untuk stay period selama bulan September 2026, dengan syarat dan ketentuan yang berlaku. Promo ini menjadi pilihan menarik bagi masyarakat yang ingin menikmati staycation di Bandung dengan berbagai benefit dalam satu paket.
        - paragraph [ref=f49e297]
        - paragraph [ref=f49e298]:
          - strong [ref=f49e299]: Tentang Grand Pasundan Convention Hotel
        - paragraph [ref=f49e300]: Grand Pasundan Convention Hotel adalah hotel bintang empat yang dikenal sebagai salah satu ikon perhotelan di Kota Bandung, menawarkan 164 kamar terbaru 3 Bedroom Pasundan Suite, 15 ruang meeting, dan ballroom berkapasitas hingga 1.200 orang. Dengan akses mudah dari gerbang tol Pasir Koja dan dekat dengan pusat bisnis serta destinasi wisata, hotel ini menjadi pilihan strategis bagi tamu local maupun internasional.
