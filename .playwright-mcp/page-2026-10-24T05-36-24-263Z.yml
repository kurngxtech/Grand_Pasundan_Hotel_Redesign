        - paragraph [ref=f49e357]: Dengan menjadi anggota, pengguna dapat menikmati fasilitas kolam renang yang luas dan bersih, ideal untuk berolahraga maupun bersantai bersama keluarga. Sementara fasilitas fitness center dilengkapi dengan peralatan yang mendukung berbagai jenis latihan, mulai dari cardio hingga strength training.
        - paragraph [ref=f49e358]: “Program membership ini kami hadirkan sebagai bentuk komitmen Grand Pasundan Covention Hotel dalam mendukung gaya hidup sehat bagi masyarakat umum. Kami ingin menjadikan fasilitas hotel kami lebih terbuka dan mudah diakses, bukan hanya bagi tamu menginap, tapi juga bagi warga sekitar,” ujar Irawan Trimulia/General Manager Grand Pasundan Convention Hotel.
