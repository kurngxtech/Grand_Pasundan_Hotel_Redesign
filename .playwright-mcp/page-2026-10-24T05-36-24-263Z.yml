        - heading [level=2] [ref=f49e182]:
          - strong [ref=f49e183]: GRAND PASUNDAN CONVENTION HOTEL HADIRKAN “OCTOBERHEMAT”, PROMO SPESIAL UNTUK STAYCATION DAN MEETING DI BANDUNG
        - paragraph [ref=f49e184]
        - heading [level=3] [ref=f49e185]:
          - strong [ref=f49e186]: Nikmati Kamar Deluxe Mulai Rp610.100 Nett/Room/Night dan Paket Meeting Mulai Rp101.101 Nett/Pax
        - paragraph [ref=f49e187]:
          - strong [ref=f49e188]: Bandung, Oktober 2026
          - text: — Menyambut bulan Oktober,
          - strong [ref=f49e189]: Grand Pasundan Convention Hotel Bandung
          - text: kembali menghadirkan penawaran spesial melalui program
          - strong [ref=f49e190]: “
          - strong [ref=f49e191]: OctoBERHEMAT”
          - text: . Mengusung konsep hemat namun tetap memberikan pengalaman menginap dan pertemuan yang nyaman, promo ini menghadirkan dua pilihan penawaran menarik, yaitu
          - strong [ref=f49e192]: Room Package
          - text: dan
          - strong [ref=f49e193]: Meeting Package
          - text: .
        - paragraph [ref=f49e194]:
          - text: Melalui program “OctoberHemat”, masyarakat dapat menikmati pengalaman menginap di kamar Deluxe dengan harga mulai dari
          - strong [ref=f49e195]: Rp610.100 nett/room/night
          - text: ", sekaligus mendapatkan berbagai benefit yang dirancang untuk membuat pengalaman staycation di Bandung semakin lengkap."
        - heading [level=2] [ref=f49e196]:
          - strong [ref=f49e197]: Staycation Nyaman dengan Beragam Benefit
        - paragraph [ref=f49e198]:
          - text: Untuk pilihan
          - strong [ref=f49e199]: Room Package
          - text: ", tamu dapat menikmati pengalaman menginap di Deluxe Room yang sudah termasuk"
          - strong [ref=f49e200]: sarapan untuk 2 orang
          - text: .
        - paragraph [ref=f49e201]:
          - text: Tidak hanya itu, tamu juga akan mendapatkan
          - strong [ref=f49e202]: Free 1 portion Peuyeum Goreng Haneuteun
          - text: ", salah satu sajian yang dapat melengkapi pengalaman kuliner selama berada di Grand Pasundan Convention Hotel."
        - paragraph [ref=f49e203]:
          - text: Tamu juga dapat menikmati
          - strong [ref=f49e204]: akses gratis ke seluruh fasilitas hotel
          - text: ", sehingga waktu menginap dapat dimanfaatkan untuk bersantai dan menikmati berbagai fasilitas yang tersedia."
        - paragraph [ref=f49e205]:
          - text: Bagi tamu yang ingin memperpanjang masa tinggal,
          - strong [ref=f49e206]: “OctoBERHEMAT”
          - text: "juga menawarkan keuntungan tambahan berupa:"
        - list [ref=f49e207]:
          - listitem [ref=f49e208]:
            - strong [ref=f49e209]: 10% off
            - text: untuk malam tambahan pertama
          - listitem [ref=f49e210]:
            - strong [ref=f49e211]: 25% off
            - text: untuk malam tambahan kedua
        - paragraph [ref=f49e212]:
          - text: Dengan kombinasi harga dan benefit tersebut,
          - strong [ref=f49e213]: “OctoBERHEMAT”
          - text: menjadi pilihan menarik bagi masyarakat yang ingin menikmati
          - strong [ref=f49e214]: staycation di Bandung dengan lebih hemat tanpa mengurangi kenyamanan
          - text: .
        - heading [level=2] [ref=f49e215]:
          - strong [ref=f49e216]
        - heading [level=2] [ref=f49e217]:
          - strong [ref=f49e218]: Meeting Package Mulai Rp101.101 Nett/Pax
        - paragraph [ref=f49e219]:
          - text: Tidak hanya menawarkan promo untuk kebutuhan leisure, Grand Pasundan Convention Hotel juga menghadirkan
          - strong [ref=f49e220]: Meeting Package
          - text: dalam program “OctoberHemat”.
        - paragraph [ref=f49e221]:
          - text: Paket meeting ditawarkan dengan harga mulai dari
          - strong [ref=f49e222]: Rp101.101 nett/pax
          - text: ", sehingga dapat menjadi alternatif bagi perusahaan, komunitas, instansi, maupun organisasi yang membutuhkan tempat meeting dengan fasilitas yang lengkap dan nyaman."
        - paragraph [ref=f49e223]:
          - text: Dengan paket tersebut, peserta mendapatkan
          - strong [ref=f49e224]: 3 Hours Meeting Room Usage
          - text: dengan ketentuan minimum reservasi sebanyak
          - strong [ref=f49e225]: 20 pax
          - text: .
        - paragraph [ref=f49e226]:
          - text: Untuk mendukung kelancaran presentasi dan kegiatan meeting, fasilitas yang tersedia meliputi
          - strong [ref=f49e227]: infocus & screen serta Smart Board TV Interactive
          - text: . Paket ini juga telah memperhitungkan
          - strong [ref=f49e228]: 21% tax & service
          - text: ", sehingga memberikan kemudahan bagi penyelenggara dalam mempersiapkan kebutuhan kegiatan."
        - paragraph [ref=f49e229]:
          - text: “Melalui program
          - strong [ref=f49e230]: OctoBERHEMAT,
          - text: kami ingin memberikan pilihan yang lebih fleksibel bagi masyarakat, baik untuk kebutuhan staycation maupun meeting. Kami berharap promo ini dapat memberikan pengalaman yang nyaman sekaligus memberikan nilai lebih bagi tamu yang memilih Grand Pasundan Convention Hotel,” ujar
          - emphasis [ref=f49e231]: Irina Yusha Fadilah, Sales & Marketing Manager Grand Pasundan Convention Hotel.
        - paragraph [ref=f49e232]:
          - text: Program
          - strong [ref=f49e233]: “
          - strong [ref=f49e234]: OctoBERHEMAT”
          - text: menjadi salah satu bentuk komitmen Grand Pasundan Convention Hotel untuk terus menghadirkan penawaran yang relevan dengan kebutuhan masyarakat, baik untuk perjalanan leisure, quality time bersama keluarga, maupun kebutuhan bisnis dan kegiatan perusahaan.
        - paragraph [ref=f49e235]:
          - text: Dengan lokasi yang strategis di Kota Bandung serta fasilitas yang mendukung kebutuhan
          - strong [ref=f49e236]: accommodation, meeting, convention, dan event
          - text: ", Grand Pasundan Convention Hotel menjadi salah satu pilihan bagi masyarakat yang mencari pengalaman hospitality dalam satu lokasi."
        - heading [level=2] [ref=f49e237]:
          - strong [ref=f49e238]
        - heading [level=2] [ref=f49e239]:
          - strong [ref=f49e240]: Tentang Grand Pasundan Convention Hotel
        - paragraph [ref=f49e241]:
          - strong [ref=f49e242]: Grand Pasundan Convention Hotel
          - text: merupakan hotel bintang empat di Kota Bandung yang menawarkan pengalaman hospitality dengan konsep yang memadukan kenyamanan modern dan identitas Pasundan. Grand Pasundan Convention Hotel adalah hotel bintang empat yang dikenal sebagai salah satu ikon perhotelan di Kota Bandung, menawarkan 164 kamar terbaru 3 Bedroom Pasundan Suite, 15 ruang meeting, dan ballroom berkapasitas hingga 1.200 orang. Dengan akses mudah dari gerbang tol Pasir Koja dan dekat dengan pusat bisnis serta destinasi wisata, hotel ini menjadi pilihan strategis bagi tamu local maupun internasional.
        - heading [level=3] [ref=f49e243]:
          - strong [ref=f49e244]: Informasi & Reservasi
        - paragraph [ref=f49e245]:
          - strong [ref=f49e246]: Grand Pasundan Convention Hotel
          - text: Jalan Peta No. 147–149, Bandung 40233
          - strong [ref=f49e247]: "WhatsApp:"
