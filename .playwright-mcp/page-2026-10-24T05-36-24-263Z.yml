        - paragraph [ref=f49e325]: Grand Pasundan Convention Hotel adalah hotel bintang empat yang dikenal sebagai salah satu ikon perhotelan di Kota Bandung, menawarkan 155 Kamar, 7 Suites, kamar terbaru 3 Bedroom Pasundan Suite, 15 ruang meeting, dan ballroom berkapasitas hingga 1.200 orang. Dengan akses mudah dari gerbang tol Pasir Koja dan dekat dengan pusat bisnis serta destinasi wisata, hotel ini menjadi pilihan strategis bagi tamu local maupun internasional.
