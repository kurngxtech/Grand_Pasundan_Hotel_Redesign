        - paragraph [ref=f49e306]
        - separator [ref=f49e307]
        - heading [level=2] [ref=f49e308]:
          - strong [ref=f49e309]: GRAND PASUNDAN CONVENTION HOTEL HADIRKAN “KAMPUNG RAMADHAN” JEJAK RASA KULINER NUSANTARA
        - heading [level=2] [ref=f49e310]:
          - strong [ref=f49e311]: UNTUK MOMEN IFTAR ISTIMEWA
        - paragraph [ref=f49e312]
        - paragraph [ref=f49e313]:
          - generic [ref=f49e314]:
            - text: Bandung, Februari 2026 — Dalam semangat menyambut bulan suci Ramadan 2026, Grand Pasundan Convention Hotel kembali menghadirkan program buka puasa tematik bertajuk
            - emphasis [ref=f49e315]: "Kampung Ramadhan: Jejak Rasa Kuliner Nusantara"
            - text: . Mengangkat kekayaan cita rasa tradisional Indonesia, program ini menjadi wujud komitmen hotel dalam menghadirkan pengalaman iftar yang tidak hanya lezat, tetapi juga sarat makna kebersamaan dan budaya. Konsep ini menjadikan Kampung Ramadhan sebagai pilihan ideal untuk acara buka puasa bersama keluarga besar, komunitas, hingga gathering perusahaan yang mengutamakan kenyamanan dan kualitas pelayanan.
        - paragraph [ref=f49e316]:
          - text: Berlokasi di
          - strong [ref=f49e317]: Coffeeshop Restaurant, Lantai Lobby
          - text: ", para tamu dapat menikmati beragam sajian tradisional mulai dari takjil khas Nusantara, aneka gorengan, jajanan pasar, hingga hidangan utama yang menggugah selera. Konsep Kampung Ramadhan dihadirkan untuk membawa nostalgia kuliner Indonesia sekaligus menciptakan momen berbuka puasa yang berkesan bersama keluarga, kolega, maupun sahabat."
        - paragraph [ref=f49e318]:
          - text: Program iftar ini ditawarkan dengan harga Rp150.000 nett per pax, dilengkapi berbagai penawaran spesial selama periode Ramadan, seperti promo
          - strong [ref=f49e319]: buy 4 get 1 free
          - text: pada 20 hingga 27 Februari 2026 serta
          - strong [ref=f49e320]: buy 10 get 1 free
          - text: yang berlaku mulai 28 Februari hingga 16 Maret 2026. Sebagai bentuk apresiasi kepada para tamu, hotel turut menghadirkan
          - strong [ref=f49e321]: program undian berhadiah satu ekor kambing
          - text: yang dapat diikuti sepanjang periode Kampung Ramadhan berlangsung. Program ini diharapkan dapat menambah antusiasme serta memberikan pengalaman Ramadan yang semakin berkesan.
        - paragraph [ref=f49e322]: “Melalui Kampung Ramadhan, kami ingin menghadirkan pengalaman iftar yang tidak hanya lezat, tetapi juga penuh makna dan nuansa kebersamaan khas Ramadan, dengan mengangkat kekayaan kuliner Nusantara,” ujar Food & Beverage Manager, Dani Kurniawan.
        - paragraph [ref=f49e323]:
